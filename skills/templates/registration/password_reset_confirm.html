{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="mb-3 text-center">Enter new password</h2>
                <p class="text-muted text-center mb-4">Please enter your new password twice so we can verify you typed it in correctly.</p>
                
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100 py-2 mt-3">Change my password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
