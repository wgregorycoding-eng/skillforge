{% extends 'skills/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="mb-3 text-center">Password Reset</h2>
                <p class="text-muted text-center mb-4">Forgotten your password? Enter your email address below, and we'll email instructions for setting a new one.</p>
                
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 py-2 mt-3">Reset my password</button>
                </form>
                
                <div class="text-center mt-3">
                    <a href="{% url 'login' %}" class="text-decoration-none">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
