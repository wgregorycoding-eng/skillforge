{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 text-center">
                <h2 class="mb-3">Check your email</h2>
                <p class="text-muted mb-4">We've emailed you instructions for setting your password, if an account exists with the email you entered. You should receive them shortly.</p>
                <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2">Return to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
