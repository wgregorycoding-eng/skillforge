{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 text-center">
                <h2 class="mb-3 text-success">Password reset complete</h2>
                <p class="text-muted mb-4">Your password has been set successfully. You may go ahead and log in now with your new password.</p>
                <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2">Log in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
