{% extends 'skills/base.html' %}

{% block content %}
<div class="d-flex justify-content-center align-items-center mt-5">
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 420px;">
        <h3 class="text-center mb-4">🔐 Login to SkillForge</h3>

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                {{ form.as_p }}
            </div>

            <button type="submit" class="btn btn-dark w-100 mb-3">Login</button>
        </form>

        <hr class="my-3">
        <div class="text-center">
            <p class="mb-2">Don't have an account?</p>
            <a href="{% url 'register' %}" class="btn btn-outline-primary w-100 mb-2">Register Here</a>
            <small>
                <a href="{% url 'password_reset' %}" class="text-muted">Forgot your password?</a>
            </small>
        </div>
    </div>
</div>
{% endblock %}
