{% extends 'skills/base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="mb-3 text-center">🔐 Login to SkillForge</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-dark w-100 py-2 mt-2">Login</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
