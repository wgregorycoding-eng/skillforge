{% extends 'skills/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0 p-4">
            <div class="card-body">
                <h2 class="text-danger mb-3">⚠️ Confirm Deletion</h2>
                <p class="lead">Are you sure you want to delete <strong>"{{ skill.title }}"</strong>?</p>
                <p class="text-muted small">This action will also remove all associated study sessions and learning resources.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                    <a href="{% url 'skill_detail' skill.pk %}" class="btn btn-secondary px-4 ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
