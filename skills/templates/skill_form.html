{% extends 'skills/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="mb-4 text-center">{% if edit %}Edit Skill{% else %}Create New Skill{% endif %}</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <!-- Datalist providing preset suggestions -->
                    <datalist id="category-options">
                        <option value="Programming">
                        <option value="Design">
                        <option value="Languages">
                        <option value="Business">
                        <option value="Music">
                        <option value="Fitness">
                    </datalist>

                    <button type="submit" class="btn btn-success w-100 py-2 mt-3">{% if edit %}Save Changes{% else %}Create Skill{% endif %}</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'dashboard' %}" class="text-decoration-none">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
